<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎁 A Surprise For You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #1a1a40, #3a1c71, #270082);
    background-size: 200% 200%;
    animation: bgShift 12s ease infinite;
    color: #fff;
    position: relative;
    touch-action: manipulation;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ========== GIFT SCREEN (before click) — dead center ========== */
  #giftScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
    padding: 20px;
    transition: opacity .5s, transform .5s;
  }
  #giftScreen.hide { opacity: 0; transform: scale(1.3); pointer-events: none; }

  .gift {
    font-size: 110px;
    display: inline-block;
    animation: shake 1.6s ease infinite;
    cursor: pointer;
    filter: drop-shadow(0 10px 25px rgba(255,224,102,.35));
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg) scale(1); }
    10% { transform: rotate(-8deg) scale(1.05); }
    20% { transform: rotate(8deg) scale(1.05); }
    30% { transform: rotate(-6deg) scale(1.03); }
    40% { transform: rotate(6deg) scale(1.03); }
    50% { transform: rotate(0deg) scale(1); }
  }

  .hint {
    margin-top: 22px;
    font-size: clamp(18px, 5.5vw, 24px);
    color: #ffe066;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
    animation: pulse 1.6s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }

  .openBtn {
    margin-top: 28px;
    padding: 16px 44px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #3a1c71;
    background: linear-gradient(135deg, #ffe066, #ffb347);
    border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,179,71,.45);
    transition: transform .15s;
  }
  .openBtn:active { transform: scale(.9); }

  /* ========== SURPRISE SCREEN (after click) — dead center ========== */
  #surpriseScreen {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 5;
    overflow-y: auto;
  }
  #surpriseScreen.show { display: flex; animation: fadeIn .8s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .cardInner { max-width: 420px; width: 100%; }

  body.party {
    background: linear-gradient(160deg, #3a1c71, #d76d77, #ffaf7b);
    background-size: 200% 200%;
  }

  .cake {
    width: 180px;
    height: 180px;
    margin: 0 auto 10px;
    border-radius: 24px;
    overflow: hidden;
    border: 4px solid rgba(255,255,255,.8);
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
    animation: bounce 2s ease infinite;
    background: rgba(255,255,255,.08);
  }

  .cake img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  h1 {
    font-size: clamp(28px, 9vw, 44px);
    margin: 18px 0 8px;
    text-shadow: 0 3px 12px rgba(0,0,0,.35);
    animation: popIn 1s ease;
  }
  @keyframes popIn {
    0% { transform: scale(.4); opacity: 0; }
    80% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .name {
    font-size: clamp(34px, 11vw, 54px);
    font-weight: 800;
    color: #ffe066;
    text-shadow: 0 0 20px rgba(255,224,102,.6), 0 3px 10px rgba(0,0,0,.4);
    margin: 6px 0 14px;
    animation: glow 2s ease infinite alternate, popIn 1.2s ease;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px rgba(255,224,102,.4), 0 3px 10px rgba(0,0,0,.4); }
    to   { text-shadow: 0 0 30px rgba(255,224,102,.95), 0 3px 10px rgba(0,0,0,.4); }
  }

  .msg { font-size: clamp(15px, 4.5vw, 18px); line-height: 1.6; opacity: .95; animation: fadeUp 1.6s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: .95; transform: translateY(0); }
  }

  .heart { color: #ff5e78; }

  .btn {
    margin-top: 26px;
    padding: 14px 34px;
    font-size: 17px;
    font-weight: 700;
    color: #3a1c71;
    background: #ffe066;
    border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    animation: popIn 2s ease;
    transition: transform .15s;
  }
  .btn:active { transform: scale(.92); }

  /* Balloons */
  .balloon {
    position: absolute; bottom: -120px;
    font-size: 44px;
    animation: floatUp linear infinite;
    opacity: .9;
    z-index: 2;
    user-select: none; pointer-events: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-6deg); }
    50%  { transform: translateY(-60vh) rotate(8deg); }
    100% { transform: translateY(-120vh) rotate(-6deg); }
  }

  /* Confetti */
  .confetti {
    position: absolute; top: -20px;
    width: 10px; height: 16px;
    border-radius: 3px;
    animation: fall linear infinite;
    z-index: 3;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  /* Pop burst */
  .pop {
    position: absolute;
    font-size: 26px;
    animation: popAnim 1.4s ease-out forwards;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes popAnim {
    0%   { opacity: 1; transform: scale(.3); }
    70%  { opacity: 1; transform: scale(1.4) rotate(10deg); }
    100% { opacity: 0; transform: scale(1.8) rotate(15deg) translateY(-40px); }
  }
</style>
<base target="_blank">
</head>
<body>

<!-- 🎁 GIFT SCREEN — shown first -->
<div id="giftScreen">
  <div class="gift" id="giftEmoji">🎁</div>
  <p class="hint">Tap to open your gift</p>
  <button class="openBtn" id="openBtn">Open 🎀</button>
</div>

<!-- 🎂 SURPRISE SCREEN — revealed on click -->
<div id="surpriseScreen">
  <div class="cardInner">
    <div class="cake">
      <img src="pic/z.jpg" alt="Mother's photo" />
    </div>
    <h1>Happy Birthday</h1>
    <div class="name" id="momName">Mama</div>
    <p class="msg">
      To the most wonderful mom in the world —<br>
      thank you for your endless love, warmth and care.<br>
      Wishing you a day as beautiful as you are! <span class="heart">❤️</span>
    </p>
    <button class="btn" id="confettiBtn">🎉 Celebrate!</button>
  </div>
</div>

<script>
  // ======================================================
  // 👇 PUT YOUR MOTHER'S NAME HERE (change only this line) 👇
  // ======================================================
  const MOM_NAME = "Mama";
  document.getElementById("momName").textContent = MOM_NAME;

  const emojis = ["🎉","🎊","❤️","💐","🌟","💖","🎁","😍"];
  const colors = ["#ffe066","#ff5e78","#4ecdc4","#a78bfa","#ffffff","#ff9f43"];
  const balloonIcons = ["🎈","🎈","🎈","🎈","🎁","💐"];
  let partyStarted = false;

  function burst(count) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "pop";
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (Math.random() * 90 + 5) + "vw";
      p.style.top  = (Math.random() * 60 + 10) + "vh";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  }

  // Balloons
  function makeBalloon() {
    const b = document.createElement("div");
    b.className = "balloon";
    b.textContent = balloonIcons[Math.floor(Math.random() * balloonIcons.length)];
    b.style.left = Math.random() * 95 + "vw";
    b.style.animationDuration = (7 + Math.random() * 6) + "s";
    b.style.animationDelay = (Math.random() * 5) + "s";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 16000);
  }

  // Falling confetti
  function makeConfetti() {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (3 + Math.random() * 4) + "s";
    c.style.animationDelay = (Math.random() * 3) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 9000);
  }

  // 🎁 OPEN THE GIFT
  function openGift() {
    if (partyStarted) return;
    partyStarted = true;

    document.getElementById("giftScreen").classList.add("hide");
    document.body.classList.add("party");

    // Vibration celebration
    if (navigator.vibrate) navigator.vibrate([80, 50, 80, 50, 150]);

    // Explosion of emojis, then reveal card
    burst(30);

    setTimeout(() => {
      document.getElementById("surpriseScreen").classList.add("show");
      if (navigator.vibrate) navigator.vibrate([100, 60, 100]);

      // Start the party effects
      for (let i = 0; i < 10; i++) makeBalloon();
      setInterval(makeBalloon, 2500);
      for (let i = 0; i < 30; i++) makeConfetti();
      setInterval(makeConfetti, 400);

      // Extra bursts to celebrate the reveal
      setTimeout(() => burst(12), 600);
      setTimeout(() => burst(12), 1200);
    }, 500);
  }

  document.getElementById("openBtn").addEventListener("click", openGift);
  document.getElementById("giftEmoji").addEventListener("click", openGift);

  // Celebrate button
  document.getElementById("confettiBtn").addEventListener("click", function() {
    burst(18);
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  });
</script>
</body>
</html>
